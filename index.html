<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1>Task Manager</h1>
      <p>Track, complete, and remove tasks quickly.</p>
    </header>

    <section class="task-input-section">
      <label for="new-task" class="sr-only">New task</label>
      <input id="new-task" type="text" placeholder="Add a new task" />
      <button id="add-task-button" type="button">Add task</button>
    </section>

    <section class="task-filter-section">
      <button class="filter-button active" data-filter="all">All</button>
      <button class="filter-button" data-filter="active">Active</button>
      <button class="filter-button" data-filter="completed">Completed</button>
    </section>

    <section class="task-list-section">
      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
